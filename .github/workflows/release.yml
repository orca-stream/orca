name: Release

# Orca'H&M's desktop app: release-please keeps a release PR open from the commits that ship; merging
# it tags a draft release, and the jobs below fill it — the .deb and the APT repository around it,
# the Windows installer and its latest.yml — before the last one publishes it as the latest.
# Installed copies update from that release (the .deb through its APT repository, Windows through
# electron-updater), so a release only goes out once everything both need is there.
on:
  push:
    branches: [main]
  # Escape hatch: rebuild and upload a tagged release's assets, without cutting a new release.
  # Use it when a release was tagged but its assets never went up.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, e.g. orca-hm-v0.2.0"
        required: true

# Never let two releases race: tagging and filling a release must not interleave.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The package sits at the repository root ("."), so the outputs are the bare names. A package
    # under a path would namespace them (`<path>--release_created`).
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN gets its CI parked in `action_required` (see toolchain.yml);
      # RELEASE_PLEASE_TOKEN, a PAT, avoids it when set.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux:
    name: Linux package and APT repository
    needs: release-please
    # always(): on workflow_dispatch the release-please job is skipped, and a skipped dependency
    # would otherwise skip this one too. `== 'true'`: a bare string test passes on "false".
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The mirror comes from the workflow's own commit: an older tag rebuilt by hand may predate it.
      - uses: actions/checkout@v7
        with:
          path: .release-tools
          sparse-checkout: apps/hm-desktop/scripts/release-mirror.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm from corepack, pinned by `packageManager` — not pnpm/action-setup. The second
      # setup-node wires up the store cache, which needs pnpm on PATH already.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # electron-builder downloads the Electron it packages on its own: the binary that `electron`'s
      # postinstall fetches (~100 MB) only serves `pnpm start`.
      - run: pnpm install --frozen-lockfile
        env:
          VP_GIT_HOOKS: "0"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # The key that signs the APT repository. Its public half goes inside the .deb, which installs
      # it for apt (scripts/apt.ts).
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::Set the APT_SIGNING_KEY secret (an armored private key, no passphrase)."
            exit 1
          fi
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          echo "APT_SIGNING_KEY_ID=$fpr" >> "$GITHUB_ENV"
          gpg --export "$fpr" > "$RUNNER_TEMP/orca-hm.gpg"

      # The .deb points apt at this repository's latest release, whose assets are the repository.
      - name: Build the .deb
        env:
          HM_APT_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
          HM_APT_KEY_FILE: ${{ runner.temp }}/orca-hm.gpg
          # electron-builder downloads Electron (and its SHASUMS256.txt) and its tools from GitHub
          # releases, whose download URLs have failed for hours with 504s while the API served the
          # same files: scripts/release-mirror.ts fetches them through the API instead.
          GH_TOKEN: ${{ github.token }}
          ELECTRON_MIRROR: http://127.0.0.1:8799/electron/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: http://127.0.0.1:8799/electron-userland/electron-builder-binaries/
          ELECTRON_BUILDER_BINARIES_ALLOW_HTTP: "true"
        run: |
          node .release-tools/apps/hm-desktop/scripts/release-mirror.ts 8799 &
          mirror=$!
          trap 'kill "$mirror"' EXIT
          pnpm --filter @orca/hm-desktop dist:linux

      - name: Build the APT repository
        run: |
          set -euo pipefail
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          apps/hm-desktop/scripts/apt-repo.sh apps/hm-desktop/release/orca-hm_*_amd64.deb "$RUNNER_TEMP/apt"

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/apt/* --clobber

  windows:
    name: Windows installer
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The mirror comes from the workflow's own commit: an older tag rebuilt by hand may predate it.
      - uses: actions/checkout@v7
        with:
          path: .release-tools
          sparse-checkout: apps/hm-desktop/scripts/release-mirror.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          VP_GIT_HOOKS: "0"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # The publish option only writes where updates come from (app-update.yml, read by the
      # installed app) and latest.yml beside the installer; nothing is uploaded by electron-builder.
      - name: Build the installer
        env:
          HM_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
          # electron-builder downloads Electron (and its SHASUMS256.txt) and its tools from GitHub
          # releases, whose download URLs have failed for hours with 504s while the API served the
          # same files: scripts/release-mirror.ts fetches them through the API instead.
          GH_TOKEN: ${{ github.token }}
          ELECTRON_MIRROR: http://127.0.0.1:8799/electron/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: http://127.0.0.1:8799/electron-userland/electron-builder-binaries/
          ELECTRON_BUILDER_BINARIES_ALLOW_HTTP: "true"
        working-directory: apps/hm-desktop
        # A failed download still fails the build now and then: try a few times.
        run: |
          node ../../.release-tools/apps/hm-desktop/scripts/release-mirror.ts 8799 &
          mirror=$!
          trap 'kill "$mirror"' EXIT
          for attempt in 1 2 3; do
            pnpm dist:win -c.publish.provider=generic "-c.publish.url=$HM_UPDATE_URL" && exit 0
            echo "::warning::Building the installer failed (attempt $attempt)."
            sleep 30
          done
          exit 1

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/hm-desktop/release
        run: gh release upload "$TAG" orca-hm_*_x64.exe orca-hm_*_x64.exe.blockmap latest.yml --clobber

  publish:
    name: Publish the release
    needs: [release-please, linux, windows]
    # Only once both packages are up: a failed one leaves the release a draft, to be rebuilt with
    # workflow_dispatch.
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      # Published only now: until then the release is a draft, which `latest` never points at, so
      # neither apt nor the Windows updater ever sees a release without its files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
