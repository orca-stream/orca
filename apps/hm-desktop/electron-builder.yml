# Packaging for Orca'H&M's desktop app. `pnpm stage:server` must run first, and for Linux
# `node scripts/deb.ts` too: they fill build/hm-server, build/deb and build/apt (`pnpm dist:linux`,
# `pnpm dist:win` and `pnpm dist:mac` run all of it).
appId: io.github.orcastream.orca.hm
# A path-safe name: it becomes /opt/orca-hm. People see Orca'H&M (desktop entry, window, tray).
productName: orca-hm
# The package's own name is @orca/hm-desktop, which Windows would show as the install folder
# (AppData\Local\Programs\@orcahm-desktop) and the updater's cache: the app's name instead.
extraMetadata:
  name: orca-hm
artifactName: orca-hm_${version}_${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - resources/**
  - package.json
# The server runs from its own folder, with its own node_modules, outside the asar archive.
extraResources:
  - from: build/hm-server
    to: hm-server
  # A folder's own top-level node_modules is always skipped by electron-builder, so it goes as its
  # own entry. Without `.bin`: links to the CLIs, which the server never runs and Windows cannot keep.
  - from: build/hm-server/node_modules
    to: hm-server/node_modules
    filter:
      - "**/*"
      - "!.bin"
# No update feed by default. Linux updates through its APT repository; a Windows or macOS release
# passes its own (-c.publish.provider/url, see release.yml), which writes app-update.yml and
# latest.yml / latest-mac.yml. Without
# this, electron-updater among the dependencies makes electron-builder look for one, and fail.
publish: null
# The app has no runtime dependencies, and the server's native module is a Node-API prebuild.
npmRebuild: false
linux:
  target: deb
  executableName: orca-hm
  extraResources:
    # The APT repository's source and key, which the .deb's after-install puts in place. Empty in a
    # local build.
    - from: build/apt
      to: apt
  icon: resources/icon.png
  category: AudioVideo
  synopsis: Downloads shows into your library
  description: Downloads shows into your library
  syncDesktopName: true
  # Through XWayland: see the X11 note at the top of src/main.ts.
  executableArgs:
    - --ozone-platform=x11
  maintainer: selkiecode <352633863+selkiecode@users.noreply.github.com>
  desktop:
    entry:
      Name: Orca'H&M
      StartupWMClass: orca-hm
deb:
  # Also names the APT source and key (scripts/deb.ts) and what the app updates (src/main.ts).
  packageName: orca-hm
  # electron-builder's own scripts, plus adding and removing the APT repository.
  afterInstall: build/deb/after-install.tpl
  afterRemove: build/deb/after-remove.tpl
# Apple Silicon only, macOS 14 and up (the floor of the Chromium that Playwright fetches; Electron
# alone runs on 13). Not signed by Apple: electron-builder signs nothing (`identity: null`) and
# scripts/mac-sign.ts gives the app a plain ad-hoc signature, which Apple Silicon needs to run it at
# all (see there why not electron-builder's). The first launch asks for System Settings › Privacy &
# Security › Open Anyway.
afterPack: ./scripts/mac-sign.ts
mac:
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon-mac.png
  category: public.app-category.video
  minimumSystemVersion: "14.0"
  identity: null
  # Its name in the menu bar and the Dock (the bundle keeps the path-safe productName).
  extendInfo:
    CFBundleName: Orca'H&M
    CFBundleDisplayName: Orca'H&M
dmg:
  title: Orca'H&M
win:
  target: nsis
  executableName: orca-hm
  icon: resources/icon.png
# One click, for this user only: no administrator to install or to update, and it lands in
# AppData\Local\Programs\orca-hm. People see Orca'H&M in the Start menu and in Apps.
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Orca'H&M
  uninstallDisplayName: Orca'H&M
  # The downloads, the library's database and the tools stay: reinstalling finds them.
  deleteAppDataOnUninstall: false
