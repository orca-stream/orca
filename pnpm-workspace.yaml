packages:
  - apps/*
  - packages/*

catalog:
  "@jellyfin/sdk": 1.0.0
  axios: 1.20.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Same supply-chain window CI enforces. Pinned here so a global minimumReleaseAge: 0 on a dev
# machine cannot resolve a lockfile CI will reject.
minimumReleaseAge: 1440
