packages:
  - apps/*
  - packages/*

catalog:
  axios: 1.21.0
  better-sqlite3: 13.0.3
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.17
  "@hono/node-server": 2.1.6
  "@hono/zod-validator": 0.9.1
  "@jellyfin/sdk": 1.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: 4.3.5
  "@tanstack/react-query": 5.107.1
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  happy-dom: 21.0.4
  wouter: 3.13.0
  "@tailwindcss/vite": 4.3.5
  "@types/better-sqlite3": 9.6.0
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@vitejs/plugin-react": ^6.2.1
  zod: 4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
  # Security (dependabot): transitive ranges with no fixed release in the line their parents ask for.
  # minimatch 11 drops makeRe/AST/debug; electron-builder, @electron/universal and ts-morph only
  # use minimatch(), Minimatch#match/negate/set, which 11 keeps.
  minimatch@>=7.0.0 <11.0.1: ^11.0.5
  glob@>=9.0.0 <14.0.2: ^14.0.4
  # drizzle-kit's @esbuild-kit loader pins esbuild ~0.18; it only calls transform(), stable since.
  esbuild@<0.25.0: ^0.25.12
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Same supply-chain window CI enforces. Pinned here so a global minimumReleaseAge: 0 on a dev
# machine cannot resolve a lockfile CI will reject.
minimumReleaseAge: 1440

# drizzle-kit's esbuild only runs an optional postinstall speed-up; it works without it. Declared so
# `pnpm install` doesn't fail on ERR_PNPM_IGNORED_BUILDS (better-sqlite3 ships prebuilds, no script).
allowBuilds:
  esbuild: false
  # Electron's postinstall downloads its binary; the desktop app (apps/hm-desktop) needs it.
  electron: true
  # Only Squirrel.Windows uses it; the Windows build will be NSIS.
  electron-winstaller: false
